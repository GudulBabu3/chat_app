<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TukuruMukuru</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#ff6b4a" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TukuruMukuru" />
<script src="/theme.js?v=11"></script>
<link rel="stylesheet" href="/style.css?v=11" />
</head>
<body>
  <div id="chat-screen">
    <aside class="buddy-panel" aria-hidden="true">
      <div class="buddy-copy">
        <span class="eyebrow">Your red panda pal</span>
        <h2>Big stories.<br />Tiny paws.</h2>
        <p>There’s always room for one more adventure.</p>
      </div>
      <div class="mascot-stage">
        <span class="spark spark-one">✦</span><span class="spark spark-two">★</span><span class="spark spark-three">✦</span>
        <img id="buddy-mood-image" src="/stickers/neutral.webp" alt="TukuruMukuru is feeling neutral" />
      </div>
      <div class="mood-strip"><span>curious</span><span>kind</span><span>silly</span></div>
    </aside>
    <main class="chat-panel">
      <header id="chat-header" data-mood="neutral">
        <div class="avatar" aria-hidden="true"><img id="header-mood-image" src="/stickers/neutral.webp" alt="" /></div>
        <div class="header-text">
          <h1 id="pet-name">TukuruMukuru</h1>
        </div>
        <div class="header-actions">
          <button id="mood-expand-btn" type="button" title="Make TukuruMukuru bigger" aria-label="Make TukuruMukuru bigger" aria-controls="chat-header" aria-expanded="false" data-label="Big mood" class="header-control control-btn mood-expand">↗</button>
          <a id="settings-btn" href="/settings" title="Open settings" aria-label="Open settings" data-label="Settings" class="header-control control-btn">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.08V21H9.55v-.08A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.1 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.08-.4H2.3V9.55h.12A1.7 1.7 0 0 0 4.1 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.56 3.7l.06.06A1.7 1.7 0 0 0 8.5 4.1a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.08V2.3h4.05v.12A1.7 1.7 0 0 0 15 4.1a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 8.5a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.08.4h.12v4.05h-.12A1.7 1.7 0 0 0 19.4 15Z"></path>
            </svg>
          </a>
        </div>
      </header>
      <div id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>
      <div id="typing-indicator" class="hidden" role="status">TukuruMukuru is thinking<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
      <form id="message-form">
        <button type="button" id="mic-btn" title="Speak your message" aria-label="Speak your message">🎤</button>
        <label class="sr-only" for="message-input">Message TukuruMukuru</label>
        <input id="message-input" type="text" placeholder="Tell me anything…" autocomplete="off" maxlength="2000" />
        <button type="submit" aria-label="Send message"><span>Send</span><span class="send-arrow" aria-hidden="true">↑</span></button>
      </form>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js?v=12"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
