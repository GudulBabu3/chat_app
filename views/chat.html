<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TukuruMukuru</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#1b120c" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TukuruMukuru" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="chat-screen">
    <header>
      <div class="avatar">🐾</div>
      <div class="header-text">
        <h1 id="pet-name">TukuruMukuru</h1>
        <span id="pet-status">connecting...</span>
      </div>
      <button id="notify-btn" title="Get notified when TukuruMukuru checks in" class="hidden">🔔</button>
      <button id="logout-btn" title="Log out">Log out</button>
    </header>
    <div id="messages"></div>
    <div id="typing-indicator" class="hidden">TukuruMukuru is typing<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    <form id="message-form">
      <input id="message-input" type="text" placeholder="Say something..." autocomplete="off" maxlength="2000" />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/push-client.js"></script>
  <script src="/client.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
