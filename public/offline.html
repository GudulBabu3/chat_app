<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline - TukuruMukuru</title>
<meta name="theme-color" content="#ff6b4a" />
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css?v=6" />
</head>
<body class="login-body">
  <div class="login-shell offline-shell">
    <button type="button" class="theme-toggle login-theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode" aria-pressed="false" data-label="Dark mode">☾</button>
    <div class="login-mascot" aria-hidden="true"><img src="/stickers/sad.webp" alt="" /></div>
    <div class="login-card">
      <span class="eyebrow">Tiny connection hiccup</span>
      <h1>You’re offline</h1>
      <p class="subtitle">TukuruMukuru can’t reach the den right now. Check your connection and try again.</p>
      <button id="retry-btn" type="button">Try again <span aria-hidden="true">↻</span></button>
    </div>
  </div>
  <script>
    document.getElementById('retry-btn').addEventListener('click', () => window.location.reload());
  </script>
</body>
</html>
