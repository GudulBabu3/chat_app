<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin login - TukuruMukuru</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="avatar large">🛠️</div>
    <h1>Admin panel</h1>
    <p class="subtitle">TukuruMukuru</p>
    <form id="login-form">
      <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required autofocus />
      <button type="submit">Enter</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>
  <script src="/admin-login-client.js"></script>
</body>
</html>
