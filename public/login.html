<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in - TukuruMukuru</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#1b120c" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TukuruMukuru" />
<link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="avatar large">🐾</div>
    <h1>TukuruMukuru</h1>
    <p class="subtitle">Log in to chat</p>
    <form id="login-form">
      <input id="username" type="text" placeholder="Username" autocomplete="username" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>
  <script src="/login-client.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
