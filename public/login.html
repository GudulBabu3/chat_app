<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in - TukuruMukuru</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#ff6b4a" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TukuruMukuru" />
<script src="/theme.js?v=11"></script>
<link rel="stylesheet" href="/style.css?v=11" />
</head>
<body class="login-body">
  <div class="login-shell">
    <button type="button" class="theme-toggle login-theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode" aria-pressed="false" data-label="Dark mode">☾</button>
    <div class="login-mascot" aria-hidden="true">
      <span class="login-scribble">HELLO!</span>
      <img src="/stickers/greeting.webp" alt="" />
    </div>
    <div class="login-card">
      <span class="eyebrow">Welcome to the den</span>
      <h1>TukuruMukuru</h1>
      <p class="subtitle">Your red panda pal is ready to chat.</p>
      <form id="login-form">
        <label for="username">Your username</label>
        <input id="username" type="text" placeholder="Type it here" autocomplete="username" required />
        <label for="password">Your password</label>
        <input id="password" type="password" placeholder="Keep it secret" autocomplete="current-password" required />
        <button type="submit">Let’s chat <span aria-hidden="true">→</span></button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>
  </div>
  <script src="/login-client.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
